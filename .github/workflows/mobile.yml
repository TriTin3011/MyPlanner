name: Mobile CI

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      # Gradle của Android cần JDK 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Client `planner_api`, file `.freezed.dart` và `app_localizations*.dart` được commit sẵn,
      # nên CI không cần openapi-generator hay build_runner. Hai bước dưới bắt trường hợp
      # quên sinh lại sau khi sửa model hoặc file .arb.
      - name: Check generated l10n is up to date
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Không có key.properties trong CI nên bản release ký bằng khoá debug: chỉ để chắc
      # app build được, không phải bản phát hành.
      - name: Build APK (release)
        run: flutter build apk --release --dart-define=FLAVOR=prod
