name: myplanner
description: "Mầm: lập kế hoạch ngày, tuần, năm. Bản di động gọi chung API với web và WPF."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Client sinh từ OpenAPI (tools/gen_api.ps1). Chỉ tầng data/ được import.
  planner_api:
    path: packages/planner_api
  dio: ^5.11.1
  fl_chart: ^1.3.1
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  go_router: ^18.1.4
  google_fonts: ^9.0.0
  intl: ^0.20.3
  shared_preferences: ^2.5.3
  image_picker: ^1.2.4
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  freezed: ^4.0.3
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
