# PostgreSQL cho môi trường dev. Chạy: docker compose up -d (trong thư mục backend/)
# Mật khẩu chỉ dùng cho máy local; cổng chỉ mở trên 127.0.0.1.
services:
  db:
    image: postgres:17-alpine
    container_name: myplanner-db
    environment:
      POSTGRES_USER: myplanner
      POSTGRES_PASSWORD: myplanner_dev
      POSTGRES_DB: myplanner
    ports:
      - "127.0.0.1:5440:5432"   # 5432 trên máy đã bị Postgres cài sẵn chiếm
    volumes:
      - myplanner-pgdata:/var/lib/postgresql/data   # dữ liệu còn lại sau khi xoá container
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myplanner -d myplanner"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Object storage cho ảnh đại diện, nói cùng giao thức S3 với Cloudflare R2 khi deploy.
  # Khoá dưới đây chỉ dùng trên máy local; cổng chỉ mở trên 127.0.0.1.
  minio:
    # Lưu ý: repo minio/minio trên Docker Hub đã không còn tải được; bản này dùng image có sẵn trên máy.
    # Máy mới không có image thì thay bằng một dịch vụ tương thích S3 khác, code không phải đổi.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    pull_policy: never
    container_name: myplanner-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: myplanner
      MINIO_ROOT_PASSWORD: myplanner_dev
    ports:
      - "127.0.0.1:9100:9000"   # S3 API
      - "127.0.0.1:9101:9001"   # trang quản trị
    volumes:
      - myplanner-miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  myplanner-pgdata:
  myplanner-miniodata:
